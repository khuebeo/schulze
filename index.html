<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tính kết quả bầu chọn xếp hạng (Schulze)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1 data-i18n="h1">Tính kết quả bầu chọn xếp hạng</h1>
      <select id="lang" aria-label="Language / Ngôn ngữ"></select>
    </div>
    <p class="sub" data-i18n="sub"></p>
  </header>

  <section class="card">
    <h2 data-i18n="inputTitle"></h2>
    <p class="hint" data-i18n-html="hint"></p>
    <textarea id="ballots" rows="12" spellcheck="false"></textarea>
    <div class="row">
      <label class="file"><span data-i18n="upload"></span> <input type="file" id="file" accept=".csv,.txt,text/plain,text/csv"></label>
      <button type="button" id="example" class="secondary" data-i18n="example"></button>
      <button type="button" id="clear" class="secondary" data-i18n="clear"></button>
      <button type="button" id="run" data-i18n="run"></button>
    </div>
    <div id="errors" class="errors" hidden></div>
  </section>

  <section class="card" id="result" hidden>
    <h2 data-i18n="resultTitle"></h2>
    <div id="summary"></div>
    <div id="rounds"></div>
  </section>

  <section class="card about">
    <h2 data-i18n="aboutTitle"></h2>
    <ol id="about"></ol>
  </section>
  <footer data-i18n="footer"></footer>
</main>
<script src="i18n.js"></script>
<script src="rcv.js"></script>
<script src="app.js"></script>
</body>
</html>
