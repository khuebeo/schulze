<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tính kết quả bầu chọn xếp hạng (Schulze)</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1 data-i18n="h1">Tính kết quả bầu chọn xếp hạng</h1>
      <select id="lang" aria-label="Language / Ngôn ngữ"></select>
    </div>
    <p class="sub" data-i18n="sub">Ranked Choice Voting, phương pháp Schulze. Mọi tính toán chạy ngay trong trình duyệt, không gửi dữ liệu đi đâu.</p>
  </header>

  <section class="card">
    <h2 data-i18n="inputTitle">1. Nhập phiếu bầu</h2>
    <p class="hint" data-i18n-html="hint"></p>
    <textarea id="ballots" rows="12" spellcheck="false"></textarea>
    <div class="row">
      <label class="file"><span data-i18n="upload">Tải tệp CSV/TXT</span> <input type="file" id="file" accept=".csv,.txt,text/plain,text/csv"></label>
      <button type="button" id="example" class="secondary" data-i18n="example">Dùng ví dụ mẫu</button>
      <button type="button" id="clear" class="secondary" data-i18n="clear">Xoá</button>
      <button type="button" id="run" data-i18n="run">Tính kết quả</button>
    </div>
    <div id="errors" class="errors" hidden></div>
  </section>

  <section class="card" id="result" hidden>
    <h2 data-i18n="resultTitle">2. Kết quả</h2>
    <div id="summary"></div>
    <div id="rounds"></div>
  </section>

  <section class="card about">
    <h2 data-i18n="aboutTitle">Cách tính</h2>
    <ol id="about"></ol>
  </section>
  <footer data-i18n="footer">Mã nguồn mở, chạy hoàn toàn trên trình duyệt.</footer>
</main>
<script src="i18n.js?v=3"></script>
<script src="rcv.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
